name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: [pa2, pa3]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      # Must match the toolchain pinned by scripts/go-check.mjs (go1.27.4).
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: apps/backend/go.sum
      - run: npm ci --ignore-scripts
      - run: npm run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: apps/backend/go.sum
      - run: npm ci --ignore-scripts
      - run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: apps/backend/go.sum
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
        env:
          POSTGRES_USER: leetkob
          POSTGRES_PASSWORD: leetkob
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U leetkob"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_URL: postgres://leetkob:leetkob@127.0.0.1:5432/postgres?sslmode=disable
      # Serialize packages on the shared runner. Race and concurrent scenarios
      # inside the suites still run unchanged against the real database.
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: apps/backend/go.sum
      - run: npm ci --ignore-scripts
      - run: npm test

  sandbox-attacks:
    name: Sandbox attacks
    if: startsWith(github.ref, 'refs/tags/pa3')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: apps/backend/go.sum
      - name: Provider keys must be absent
        run: |
          for name in MODEL_API_KEY MODEL_TOKEN OPENAI_API_KEY ANTHROPIC_API_KEY GEMINI_API_KEY GOOGLE_API_KEY; do
            if [ -n "${!name}" ]; then echo "::error::$name must not be set"; exit 1; fi
          done
      - run: npm ci --ignore-scripts
      - name: Docker must be available
        run: docker info >/dev/null
      - name: Sandbox attack suite on the submitted tag
        run: |
          go test -count=1 -v ./internal/sandbox/ 2>&1 | tee /tmp/sandbox.log
          if grep -q -- "--- SKIP" /tmp/sandbox.log; then
            echo "::error::sandbox attacks must not skip on the pa3 tag"
            exit 1
          fi
        working-directory: apps/backend
      - name: Checker image reproduces labelled team cases
        run: go test -count=1 -v -run TestImageMatchesTeamCaseLabels ./internal/checker/
        working-directory: apps/backend

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: apps/backend/go.sum
      - run: npm ci --ignore-scripts
      - run: npm run security
