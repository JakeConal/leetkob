openapi: 3.1.0
info:
  title: LeeTKOB production API
  version: 2.0.0-draft.1
  summary: Language-neutral contract for the /v2 production resource families.
  description: |
    Draft for contract review (OpenSpec task 1.3). `docs/contract/v2/README.md` is the normative
    companion: it defines conventions, evaluation order, idempotency, revision vocabulary, time and
    decimal representations, and the separation from the unversioned v1.1 publication contract.
    If an implementation and this contract disagree, the implementation is wrong.
  license:
    name: Coursework repository for CSC13114
    identifier: LicenseRef-CSC13114-coursework
servers:
  - url: https://leetkob.example
    description: Placeholder origin. Paths are served from the same origin as the web application.
tags:
  - name: auth
    description: Accounts, sessions, and administrator role provisioning.
  - name: classes
    description: Classes, teaching-assistant assignment, enrollment, and rosters.
  - name: labs
    description: Lab authoring, tests, constraints, revisions, and readiness.
  - name: submissions
    description: Durable submission acceptance, results, and source.
  - name: reviews
    description: Review queue, evidence, and TA decisions.
  - name: publication
    description: Whole-lab publication.
  - name: grades
    description: Published grades, gradebook, and individual adjustments.
  - name: appeals
    description: Deduction appeals and their resolution.
  - name: events
    description: Authenticated server-sent event hints.
security:
  - sessionCookie: []

# Catalog of every problem type. `type` is `https://leetkob.example/problems/<key>`.
# `universal` problems may be returned by any operation and are not repeated per operation.
x-leetkob-problems:
  invalid-request:
    { status: 400, title: Invalid request, schema: InvalidRequestProblem, sharedWithV1: true }
  evidence-invalid: { status: 400, title: Evidence invalid, schema: EvidenceInvalidProblem }
  test-bundle-invalid: { status: 400, title: Test bundle invalid, schema: TestBundleInvalidProblem }
  authentication-required:
    { status: 401, title: Authentication required, schema: Problem, sharedWithV1: true }
  invalid-credentials: { status: 401, title: Invalid credentials, schema: Problem }
  csrf-rejected: { status: 403, title: Cross-site request rejected, schema: Problem }
  admin-role-required: { status: 403, title: Administrator role required, schema: Problem }
  ta-role-required: { status: 403, title: TA role required, schema: Problem, sharedWithV1: true }
  student-role-required: { status: 403, title: Student role required, schema: Problem }
  route-not-found:
    { status: 404, title: Route not found, schema: Problem, universal: true, sharedWithV1: true }
  user-not-found: { status: 404, title: User not found, schema: Problem }
  class-not-found: { status: 404, title: Class not found, schema: Problem }
  invitation-not-found: { status: 404, title: Invitation not found, schema: Problem }
  lab-not-found: { status: 404, title: Lab not found, schema: Problem, sharedWithV1: true }
  constraint-not-found: { status: 404, title: Constraint not found, schema: Problem }
  submission-not-found: { status: 404, title: Submission not found, schema: Problem }
  finding-not-found: { status: 404, title: Finding not found, schema: Problem }
  grade-not-found: { status: 404, title: Grade not found, schema: Problem }
  deduction-not-found: { status: 404, title: Deduction not found, schema: Problem }
  appeal-not-found: { status: 404, title: Appeal not found, schema: Problem }
  registration-rejected: { status: 409, title: Registration rejected, schema: Problem }
  role-change-not-allowed: { status: 409, title: Role change not allowed, schema: Problem }
  class-capacity-reached:
    { status: 409, title: Class capacity reached, schema: ClassCapacityReachedProblem }
  revision-conflict: { status: 409, title: Revision conflict, schema: RevisionConflictProblem }
  idempotency-key-reused: { status: 409, title: Idempotency key reused, schema: Problem }
  lab-configuration-locked:
    { status: 409, title: Lab configuration locked, schema: LabConfigurationLockedProblem }
  constraint-change-not-allowed:
    { status: 409, title: Constraint change not allowed, schema: ConstraintChangeNotAllowedProblem }
  submission-deadline-passed:
    { status: 409, title: Submission deadline passed, schema: SubmissionDeadlinePassedProblem }
  group-decision-not-allowed:
    { status: 409, title: Group decision not allowed, schema: GroupDecisionNotAllowedProblem }
  lab-still-open:
    { status: 409, title: Submissions still open, schema: LabStillOpenProblem, sharedWithV1: true }
  lab-processing-incomplete:
    { status: 409, title: Lab processing incomplete, schema: LabProcessingIncompleteProblem }
  reviews-pending:
    { status: 409, title: Reviews pending, schema: ReviewsPendingProblem, sharedWithV1: true }
  lab-already-published:
    {
      status: 409,
      title: Lab already published,
      schema: LabAlreadyPublishedProblem,
      sharedWithV1: true,
    }
  grades-not-published: { status: 409, title: Grades not published, schema: Problem }
  appeal-already-exists:
    { status: 409, title: Appeal already exists, schema: AppealAlreadyExistsProblem }
  appeal-window-closed:
    { status: 409, title: Appeal window closed, schema: AppealWindowClosedProblem }
  appeal-already-resolved: { status: 409, title: Appeal already resolved, schema: Problem }
  payload-too-large: { status: 413, title: Payload too large, schema: PayloadTooLargeProblem }
  unsupported-media-type: { status: 415, title: Unsupported media type, schema: Problem }
  rate-limited: { status: 429, title: Too many requests, schema: RateLimitedProblem }
  internal-error:
    {
      status: 500,
      title: Internal server error,
      schema: Problem,
      universal: true,
      sharedWithV1: true,
    }
  service-unavailable: { status: 503, title: Service unavailable, schema: Problem, universal: true }

paths:
  /v2/auth/register:
    post:
      tags: [auth]
      operationId: registerAccount
      summary: Create a student account and start a session.
      security: []
      x-leetkob:
        phase: 1
        actors: [public]
        scope: none
        csrf: origin
        idempotency: none
        problems: [invalid-request, registration-rejected, unsupported-media-type, rate-limited]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { $ref: "#/components/responses/SessionStarted" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Problem" }
  /v2/auth/login:
    post:
      tags: [auth]
      operationId: logIn
      summary: Verify email and password and start a session.
      security: []
      x-leetkob:
        phase: 1
        actors: [public]
        scope: none
        csrf: origin
        idempotency: none
        problems: [invalid-request, invalid-credentials, unsupported-media-type, rate-limited]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/SessionStarted" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Problem" }
  /v2/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token.
      description: |
        Reads only the refresh cookie; the body is empty. A consumed, unknown, expired, or revoked
        refresh token returns `authentication-required`. Presenting a previously consumed token
        additionally revokes its whole session family.
      security:
        - refreshCookie: []
      x-leetkob:
        phase: 1
        actors: [admin, ta, student]
        scope: own
        csrf: origin
        idempotency: none
        problems: [invalid-request, authentication-required, rate-limited]
      responses:
        "200": { $ref: "#/components/responses/SessionStarted" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Problem" }
  /v2/auth/logout:
    post:
      tags: [auth]
      operationId: logOut
      summary: Revoke the current session family and clear both cookies.
      x-leetkob:
        phase: 1
        actors: [admin, ta, student]
        scope: own
        csrf: token
        idempotency: none
        problems: [invalid-request, authentication-required, csrf-rejected]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session revoked. Both cookies are cleared.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v2/auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Read the current identity, current role, and CSRF token.
      x-leetkob:
        phase: 1
        actors: [admin, ta, student]
        scope: own
        csrf: none
        idempotency: none
        problems: [authentication-required]
      responses:
        "200":
          description: Current session.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v2/auth/users:
    get:
      tags: [auth]
      operationId: findUserByEmail
      summary: Look up one account by exact email for role provisioning.
      x-leetkob:
        phase: 1
        actors: [admin]
        scope: any
        csrf: none
        idempotency: none
        problems: [invalid-request, authentication-required, admin-role-required, user-not-found]
      parameters:
        - name: email
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Email" }
      responses:
        "200":
          description: The matching account.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v2/auth/users/{userId}/role:
    put:
      tags: [auth]
      operationId: setUserRole
      summary: Provision or withdraw an elevated role. Audited.
      description: |
        Only an administrator changes roles. Withdrawing the TA role while the account is still
        assigned to a class, or changing a student who still has enrollments to a TA, returns
        `role-change-not-allowed`. An administrator cannot change their own role.
      x-leetkob:
        phase: 1
        actors: [admin]
        scope: any
        csrf: token
        idempotency: revision
        problems:
          - invalid-request
          - authentication-required
          - csrf-rejected
          - admin-role-required
          - user-not-found
          - revision-conflict
          - role-change-not-allowed
          - unsupported-media-type
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetRoleRequest" }
      responses:
        "200":
          description: The account with its new role and revision.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /v2/classes:
    get:
      tags: [classes]
      operationId: listClasses
      summary: List the classes visible to the caller.
      description: Administrators see every class, TAs their assigned classes, students their enrolled classes.
      x-leetkob:
        phase: 1
        actors: [admin, ta, student]
        scope: own
        csrf: none
        idempotency: none
        problems: [invalid-request, authentication-required]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of classes ordered by name, then id.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [classes]
      operationId: createClass
      summary: Create a class.
      x-leetkob:
        phase: 1
        actors: [admin]
        scope: any
        csrf: token
        idempotency: none
        problems:
          - invalid-request
          - authentication-required
          - csrf-rejected
          - admin-role-required
          - unsupported-media-type
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateClassRequest" }
      responses:
        "201":
          description: The created class.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Class" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v2/classes/enrollments:
    post:
      tags: [classes]
      operationId: redeemInvitation
      summary: Join a class with an invitation code.
      description: |
        Redeeming a code for a class the student already belongs to returns the existing membership
        with `200` and creates nothing. Unknown, expired, and revoked codes are indistinguishable.
      x-leetkob:
        phase: 1
        actors: [student]
        scope: own
        csrf: token
        idempotency: natural
        problems:
          - invalid-request
          - authentication-required
          - csrf-rejected
          - student-role-required
          - invitation-not-found
          - class-capacity-reached
          - unsupported-media-type
          - rate-limited
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedeemInvitationRequest" }
      responses:
        "200":
          description: The caller's membership, new or existing.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassMember" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Problem" }
  /v2/classes/{classId}:
    get:
      tags: [classes]
      operationId: getClass
      summary: Read one class the caller administers, teaches, or is enrolled in.
      x-leetkob:
        phase: 1
        actors: [admin, ta, student]
        scope: member-class
        csrf: none
        idempotency: none
        problems: [invalid-request, authentication-required, class-not-found]
      parameters:
        - $ref: "#/components/parameters/ClassId"
      responses:
        "200":
          description: The class.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Class" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v2/classes/{classId}/teaching-assistants/{userId}:
    put:
      tags: [classes]
      operationId: assignTeachingAssistant
      summary: Assign a TA account to a class. Repeating the assignment changes nothing.
      x-leetkob:
        phase: 1
        actors: [admin]
        scope: any
        csrf: token
        idempotency: natural
        problems:
          - invalid-request
          - authentication-required
          - csrf-rejected
          - admin-role-required
          - class-not-found
          - user-not-found
          - role-change-not-allowed
      parameters:
        - $ref: "#/components/parameters/ClassId"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The TA membership.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassMember" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [classes]
      operationId: unassignTeachingAssistant
      summary: Remove a TA assignment. Access through unexpired tokens ends immediately.
      x-leetkob:
        phase: 1
        actors: [admin]
        scope: any
        csrf: token
        idempotency: natural
        problems:
          - invalid-request
          - authentication-required
          - csrf-rejected
          - admin-role-required
          - class-not-found
      parameters:
        - $ref: "#/components/parameters/ClassId"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v2/classes/{classId}/members:
    get:
      tags: [classes]
      operationId: listClassMembers
      summary: List the roster of an assigned class.
      x-leetkob:
        phase: 1
        actors: [admin, ta]
        scope: assigned-class
        csrf: none
        idempotency: none
        problems: [invalid-request, authentication-required, ta-role-required, class-not-found]
      parameters:
        - $ref: "#/components/parameters/ClassId"
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/MemberRole" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of members ordered by display name, then user id.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassMemberPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [classes]
      operationId: addClassMember
      summary: Enroll one existing student account by email.
      description: Returns `200` with the existing membership when the student is already enrolled.
      x-leetkob:
        phase: 1
        actors: [ta]
        scope: assigned-class
        csrf: token
        idempotency: natural
        problems:
          - invalid-request
          - authentication-required
          - csrf-rejected
          - ta-role-required
          - class-not-found
          - user-not-found
          - role-change-not-allowed
          - class-capacity-reached
          - unsupported-media-type
      parameters:
        - $ref: "#/components/parameters/ClassId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMemberRequest" }
      responses:
        "200":
          description: The student was already enrolled; nothing changed.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassMember" }
        "201":
          description: The new membership.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassMember" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v2/classes/{classId}/members/{userId}:
    delete:
      tags: [classes]
      operationId: removeClassMember
      summary: Remove a student from the class roster.
      description: |
        Removing a member never rewrites a lab roster frozen at an earlier submission deadline.
      x-leetkob:
        phase: 1
        actors: [ta]
        scope: assigned-class
        csrf: token
        idempotency: natural
        problems:
          - invalid-request
          - authentication-required
          - csrf-rejected
          - ta-role-required
          - class-not-found
      parameters:
        - $ref: "#/components/parameters/ClassId"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v2/classes/{classId}/roster-imports:
    post:
      tags: [classes]
      operationId: importRoster
      summary: Enroll students from a CSV roster and report every row.
      description: |
        The body is UTF-8 CSV with the header row `email,studentCode` and at most 500 data rows.
        Rows are applied independently in file order; an accepted row stays accepted when a later
        row is rejected, and re-importing the same file changes nothing. The class never exceeds
        100 enrolled students.
      x-leetkob:
        phase: 1
        actors: [ta]
        scope: assigned-class
        csrf: token
        idempotency: natural
        problems:
          - invalid-request
          - authentication-required
          - csrf-rejected
          - ta-role-required
          - class-not-found
          - payload-too-large
          - unsupported-media-type
      parameters:
        - $ref: "#/components/parameters/ClassId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, maxLength: 65536 }
      responses:
        "200":
          description: Per-row outcome. A file whose rows are all rejected still returns 200.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RosterImportResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v2/classes/{classId}/invitations:
