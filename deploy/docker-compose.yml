# Repeatable PA#3 stack. Prepared, not provisioned; see deploy/README.md.
name: leetkob

x-database-url: &database-url "postgres://${POSTGRES_USER:-leetkob}:${POSTGRES_PASSWORD:?copy deploy/.env.example to deploy/.env and set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-leetkob}?sslmode=disable"

services:
  postgres:
    image: postgres@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leetkob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy deploy/.env.example to deploy/.env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-leetkob}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      PORT: "8080"
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN in deploy/.env}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        PA3_API_ORIGIN: http://api:8080
    restart: unless-stopped
    environment:
      PA3_API_ORIGIN: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  # Judging worker. Requires the host Docker daemon and the same absolute
  # work path inside and outside the container (sandbox bind mounts).
  worker:
    profiles: ["worker"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      TMPDIR: ${WORK_ROOT:-/srv/leetkob-work}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORK_ROOT:-/srv/leetkob-work}:${WORK_ROOT:-/srv/leetkob-work}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
