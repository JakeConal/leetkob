# Enable only after the operator installs the private token file on the VM.
# This secret is mounted into the trusted worker only; no student/analyzer
# container receives its file, environment, or any application mount.
services:
  worker:
    environment:
      MODEL_OFF: "0"
      MODEL_URL: https://integrate.api.nvidia.com/v1/chat/completions
      MODEL_NAME: minimaxai/minimax-m3.1-flash
      MODEL_TOKEN_FILE: /run/secrets/model_token
      MODEL_TIMEOUT_SECONDS: "90"
      MODEL_MAX_INPUT_TOKENS: "120000"
      MODEL_MAX_OUTPUT_TOKENS: "1500"
      MODEL_INPUT_MICRO_USD_PER_TOKEN: "0"
      MODEL_OUTPUT_MICRO_USD_PER_TOKEN: "0"
      MODEL_MAX_CALLS_PER_LAB: "160"
      MODEL_MAX_CALLS_PER_DAY: "1000"
      MODEL_AUDIT_DIR: /var/lib/leetkob/model-audit
    secrets: [model_token]
    volumes:
      - model_audit:/var/lib/leetkob/model-audit

secrets:
  model_token:
    file: /etc/leetkob/model-token

volumes:
  model_audit:
